<!doctype html>
<html lang="en">
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta http-equiv="X-UA-Compatible" content="ie=edge" />

	<head>
		<meta charset="UTF-8" />
		<title>Tetragon</title> 
		<link rel="icon" type="image/x-icon" href="assets/favicon.ico?v=2" />
		<link rel="stylesheet" href="styles.css" />
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet" />
	</head>

	<body>
		<canvas id="main"></canvas>
		<div id="pause-screen"></div>
		<div id="container">
			<h1 id="menu-title">TETRAGON</h1>
			<button id="start">Start Game</button>
			<button id="settings">Settings</button>
			<button id="controls">Controls</button>
			<div id="control-doc"></div>
			<button id="leaderboard-button">Leaderboard</button>
			<button id="feedback-button">Feedback</button>
			<div id="feedback-modal">
				<h3>Send Feedback</h3>
				<textarea id="feedback-text" placeholder="Found a bug? Have a suggestion? Let us know!"></textarea>
				<div style="display: flex; gap: 10px; justify-content: center; margin-top: 10px;">
					<button id="submit-feedback">Send</button>
					<button id="close-feedback">Close</button>
				</div>
			</div>
			<div id="leaderboard-modal">
				<h3>Global Leaderboard</h3>
				<div id="leaderboard-list">Loading...</div>
				<div style="margin-top: 15px;">
					<button id="close-leaderboard">Close</button>
				</div>
			</div>
			<div id="name-modal">
				<h3>New High Score!</h3>
				<p>Enter your name for the leaderboard:</p>
				<input type="text" id="name-input" placeholder="Anonymous" maxlength="15">
				<button id="submit-score">Submit Score</button>
			</div>
		</div>
		<div id="HUD">
			<!-- <div id="fade-out"></div> -->
			<!---->
			<div id="max-health" class="hud"></div>
			<!--done-->
			<div id="health-bar" class="hud"></div>
			<div id="max-shield" class="hud"></div>
			<div id="shield-bar" class="hud"></div>
			<!--done-->
			<div id="inventory" class="hud"></div>
			<!--done-->
			<div id="level-counter" class="hud"></div>
			<!--done-->
			<div id="timer" class="hud"></div>
			<!--done-->
			<div id="console" class="hud"></div>
			<!--done-->
			<div id="upgrade-list" class="hud"></div>
		</div>
		<div id="choice-screen">
			<h1 id="choice-header"></h1>
		</div>
		<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
		<script src="main.js"></script>
		<script src="utils.js"></script>
		<script src="sprites.js"></script>
		<script src="text.js"></script>
		<script src="entity.js"></script>
		<script src="upgrades.js"></script>
		<script src="buttons.js"></script>
		<script src="particles.js"></script>
		<script src="powerups.js"></script>
		<script src="player.js"></script>
		<script src="mobs.js"></script>
		<script src="spawn.js"></script>
		<script src="bullets.js"></script>
		<script src="hud.js"></script>
		<script src="guns.js"></script>
		<script src="collision.js"></script>
		<script src="input.js"></script>
		<script src="level.js"></script>
		<script src="simulation.js"></script>
	</body>
</html>
