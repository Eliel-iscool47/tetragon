	<head>
		<meta charset="UTF-8" />

		<link rel="stylesheet" href="styles.css" />

		<canvas id="main"></canvas>

			<h1>ERROR</h1>
			<p>If you're reading this, it didn't work.</p>
		</div>
		<div id="container">
			<button id="start">Start Game</button>
			<button id="settings">Settings</button>

		</div>
		<div id="HUD">
			<!-- <div id="fade-out"></div> -->
			<!---->
			<div id="max-health" class="hud"></div>
			<!--done-->
			<div id="health-bar" class="hud"></div>
			<!--done-->
			<div id="damage-taken-bar" class="hud"></div>
			<!--done-->
			<div id="damage-bar" class="hud"></div>
			<!--done-->
			<div id="inventory" class="hud"></div>
			<!--done-->
			<div id="level-counter" class="hud"></div>

			<div id="timer" class="hud"></div>

		<script src="player.js"></script>
		<script src="mobs.js"></script>
		<script src="spawn.js"></script>
		<script src="bullets.js"></script>
		<script src="hud.js"></script>
		<script src="guns.js"></script>
		<script src="collision.js"></script>
		<script src="input.js"></script>
		<script src="level.js"></script>
		<script src="simulation.js"></script>
